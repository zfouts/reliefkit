name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.14"

# A newer push to the same ref makes the in-flight run redundant. Tags are
# excluded so a release build is never cancelled by a follow-up commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]   # floor declared in pyproject, and the image version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,web]"

      - name: Test
        # Network-marked tests are excluded by default; CI should not fail
        # because a public elevation service is having a bad day.
        run: pytest -q

  build:
    name: build and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # A release must ship the version it claims. The image tag comes from the
      # git tag while /api/health reports the packaged version, so if the two
      # disagree the published image misreports itself and the health endpoint
      # is useless for verifying what is deployed. Fail before building rather
      # than discovering it in production.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          packaged=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} would publish an image reporting version ${packaged}. Bump pyproject.toml to ${tagged} and re-tag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${packaged}"

      # Only needed for the arm64 leg. The image installs prebuilt manylinux
      # wheels rather than compiling, so emulation stays cheap.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=reliefkit
            org.opencontainers.image.description=Printable 3D terrain models from public-domain elevation data
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests build both architectures to prove they still compile,
          # but publish nothing -- a fork PR must not be able to push an image.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test the image
        # Runs the amd64 image the way compose does -- unprivileged, read-only
        # root -- and proves it actually serves. A container that builds but
        # dies on import is the failure mode this catches.
        #
        # On a tag build it also reads the version back out of the running
        # container. The step above compares two files; this compares the tag
        # against what the shipped artefact actually says about itself, which
        # is the claim anyone verifying a deploy will rely on.
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker run -d --name smoke \
            --user 10001:10001 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -p 8000:8000 "${IMAGE}"
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null); then
              echo "healthy after ${i}s: ${body}"
              docker rm -f smoke >/dev/null

              expected="${EXPECT_VERSION#v}"
              if [ -n "${expected}" ]; then
                reported=$(printf '%s' "${body}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
                if [ "${reported}" != "${expected}" ]; then
                  echo "::error::image built for ${EXPECT_VERSION} reports version ${reported} on /api/health"
                  exit 1
                fi
                echo "/api/health reports ${reported}, matching ${EXPECT_VERSION}"
              fi
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs smoke
          exit 1
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          # Empty on branch builds, which have no version to check against.
          EXPECT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # GitHub's attestation API rejects user-owned private repositories
      # outright ("Feature not available for user-owned private repositories"),
      # which fails the job even though the image published fine. Gated on
      # visibility so it starts working by itself if the repo is made public.
      #
      # This is separate from, and additional to, the SLSA provenance and SBOM
      # that buildx already attaches to the image above -- those work either
      # way, so the published image is never unattested.
      - name: Attest provenance
        if: >-
          github.event_name != 'pull_request' &&
          github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Note skipped attestation
        if: >-
          github.event_name != 'pull_request' &&
          github.event.repository.visibility != 'public'
        run: |
          echo "::notice::GitHub attestation skipped -- unavailable for user-owned private repositories. \
          The image still carries buildx SLSA provenance and an SBOM. Make the repository public to enable it."
