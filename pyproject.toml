[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliefkit"
# The single source of truth for the version. `reliefkit.__version__` reads it
# back from installed metadata, and CI refuses to publish a `v*` tag that does
# not match it -- so /api/health always reports what is actually deployed.
version = "1.0.1"
description = "Printable terrain models from public-domain elevation data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "rasterio>=1.3", "requests>=2.28", "pyproj>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]

[project.scripts]
reliefkit = "reliefkit.cli:main"
reliefkit-serve = "reliefkit.web.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/reliefkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hits live elevation services (deselect with -m 'not network')"]
